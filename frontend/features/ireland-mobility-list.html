<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Auxílio com Mobilidade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body class="page-enter">
    <div class="background"></div>

    <div id="sidebar"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div id="navbar"></div>

    <div class="doc-list-page">
      <h2 id="doc-list-title" class="doc-list-title">Auxílio com Mobilidade</h2>

      <div class="doc-list-grid" id="doc-list-container">
        <!-- cards aqui -->
      </div>
    </div>

    <script src="../../js/supabase.js"></script>
    <script src="../../js/components.js"></script>

    <script>
      const bg = document.querySelector(".background");

      document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 60;
        const y = (window.innerHeight / 2 - e.clientY) / 60;
        bg.style.transform = `scale(1.1) translate(${x}px,${y}px)`;
      });

      async function loadUser() {
        const { data } = await supabase.auth.getUser();

        if (!data.user) {
          window.location.href = "../index.html";
          return;
        }
      }

      loadUser();

      /* =========================
         FILTRO POR TIPO
      ========================= */

      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get("type");

      const titles = {
        "Carteira de Motorista": "Auxílio com Carteira de Motorista",
        "Compra de Carro": "Auxílio com Compra de Carro",
        "Venda de Carro": "Auxílio com Venda de Carro",
        "Transporte Público": "Auxílio com Transporte Público",
        Carona: "Auxílio com Carona",
        "Dicas de Mobilidade": "Auxílio com Dicas de Mobilidade",
      };

      if (type && titles[type]) {
        document.getElementById("doc-list-title").textContent = titles[type];
      }

      /* =========================
         SLOGAN
      ========================= */

      setTimeout(() => {
        const slogan = document.querySelector(".home-slogan");

        if (slogan) {
          slogan.textContent =
            "Irlanda / Buscar ajuda / Auxílio com mobilidade";
        }
      }, 200);

      /* =========================
         CARREGAR DADOS
      ========================= */

      async function loadMobility() {
        const container = document.getElementById("doc-list-container");

        let query = supabase
          .from("mobility_help")
          .select("*")
          .eq("country", "Ireland");

        if (type) {
          query = query.eq("mobility_type", type);
        }

        const { data, error } = await query;

        if (error) {
          container.innerHTML = "<p>Erro ao carregar dados</p>";
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = "<p>Nenhuma ajuda encontrada</p>";
          return;
        }

        data.forEach((item) => {
          let icon = "/frontend/images/mobility.png";

          if (item.mobility_type === "Carteira de Motorista") {
            icon = "/frontend/images/license.png";
          } else if (item.mobility_type === "Compra de Carro") {
            icon = "/frontend/images/car-buy.png";
          } else if (item.mobility_type === "Venda de Carro") {
            icon = "/frontend/images/car-sell.png";
          } else if (item.mobility_type === "Transporte Público") {
            icon = "/frontend/images/bus.png";
          } else if (item.mobility_type === "Carona") {
            icon = "/frontend/images/carpool.png";
          } else if (item.mobility_type === "Dicas de Mobilidade") {
            icon = "/frontend/images/mobility2.png";
          }

          const card = document.createElement("div");
          card.className = "doc-list-card";

          card.innerHTML = `
            <img src="${icon}" class="doc-list-icon" />

            <h3 class="doc-list-name">
              ${item.helper_name}
            </h3>

            <p class="doc-list-city">
              ${item.city} • ${item.support_type}
            </p>

            <p class="doc-list-desc">
              ${item.description}
            </p>

            <button
              class="doc-list-btn"
              onclick="window.open('https://wa.me/${item.contact.replace(
                /\D/g,
                "",
              )}', '_blank')"
            >
              Entrar em contato
            </button>
          `;

          container.appendChild(card);
        });
      }

      loadMobility();
    </script>
  </body>
</html>
