<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Auxílio com Mobilidade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body class="page-enter">
    <div class="background"></div>

    <div id="sidebar"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div id="navbar"></div>

    <div class="country-container">
      <h2>Cadastro de Auxílio com Mobilidade</h2>

      <form id="mobilityFormAU" class="form-modern-jobs">
        <div class="form-grid-jobs">
          <!-- Tipo de ajuda -->
          <div class="form-field-jobs">
            <label>Tipo de Ajuda</label>
            <select id="mobility_type" required>
              <option value="">Selecione...</option>
              <option value="Carteira de Motorista">
                Carteira de Motorista
              </option>
              <option value="Compra de Carro">Compra de Carro</option>
              <option value="Venda de Carro">Venda de Carro</option>
              <option value="Transporte Público">Transporte Público</option>
              <option value="Carona">Carona</option>
              <option value="Dicas de Mobilidade">Dicas de Mobilidade</option>
            </select>
          </div>

          <!-- Nome -->
          <div class="form-field-jobs">
            <label>Seu Nome</label>
            <input
              type="text"
              id="helper_name"
              placeholder="Ex: João Silva"
              required
            />
          </div>

          <!-- Cidade -->
          <div class="form-field-jobs">
            <label>Cidade</label>
            <input type="text" id="city" placeholder="Ex: Brisbane" required />
          </div>

          <!-- Forma de ajuda -->
          <div class="form-field-jobs">
            <label>Forma de Ajuda</label>
            <select id="support_type" required>
              <option value="">Selecione...</option>
              <option value="Presencial">Presencial</option>
              <option value="Online">Online</option>
            </select>
          </div>

          <!-- Contato -->
          <div class="form-field-jobs">
            <label>Contato</label>
            <input
              type="text"
              id="contact"
              placeholder="WhatsApp, Email ou Telefone"
              required
            />
          </div>

          <!-- Descrição -->
          <div class="form-field-jobs full-width-jobs">
            <label>Descrição</label>
            <textarea
              id="description"
              placeholder="Ex: Posso ajudar brasileiros a transferir a CNH brasileira para a Austrália e explicar todo o processo."
              rows="8"
              required
            ></textarea>
          </div>
        </div>

        <div class="form-actions-jobs">
          <button type="submit" class="btn-submit-jobs">Publicar ajuda</button>
        </div>
      </form>
    </div>

    <script src="../../js/supabase.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/app.js"></script>

    <script>
      const bg = document.querySelector(".background");

      document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 60;
        const y = (window.innerHeight / 2 - e.clientY) / 60;
        bg.style.transform = `scale(1.1) translate(${x}px,${y}px)`;
      });

      async function loadUser() {
        const { data } = await supabase.auth.getUser();

        if (!data.user) {
          window.location.href = "../index.html";
          return;
        }

        const name = data.user.user_metadata.name || "Usuário";

        document.getElementById("userName").textContent = name;
        document.getElementById("avatar").textContent = name
          .charAt(0)
          .toUpperCase();
      }

      loadUser();

      setTimeout(() => {
        const slogan = document.querySelector(".home-slogan");

        if (slogan) {
          slogan.textContent =
            "Austrália / Oferecer ajuda / Cadastro de auxílio com mobilidade";
        }
      }, 200);

      document
        .getElementById("mobilityFormAU")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const mobility_type = document.getElementById("mobility_type").value;

          const helper_name = document.getElementById("helper_name").value;

          const city = document.getElementById("city").value;

          const support_type = document.getElementById("support_type").value;

          const contact = document.getElementById("contact").value;

          const description = document.getElementById("description").value;

          const { error } = await supabase.from("mobility_help").insert([
            {
              country: "Australia",
              mobility_type,
              helper_name,
              city,
              support_type,
              contact,
              description,
            },
          ]);

          if (error) {
            alert("Erro ao cadastrar ajuda: " + error.message);
            return;
          }

          alert("Ajuda cadastrada com sucesso!");

          const btn = this.querySelector(".btn-submit-jobs");

          btn.style.transform = "scale(0.97)";

          setTimeout(() => {
            btn.style.transform = "scale(1)";
          }, 150);

          this.reset();
        });
    </script>
  </body>
</html>
